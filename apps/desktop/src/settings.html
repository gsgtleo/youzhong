<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'" />
    <title>服务器地址</title>
    <style>
      :root {
        color-scheme: light dark;
        --brand: #4772fa;
        --ink: #1b1f24;
        --muted: #6b7280;
        --line: #e3e6ec;
        --panel: #ffffff;
        --bg: #f7f8fa;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e8ebf2;
          --muted: #9aa3b2;
          --line: #2b303b;
          --panel: #171a21;
          --bg: #111318;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 18px 20px 16px;
        font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--ink);
        user-select: none;
      }
      h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
      p.hint { margin: 0 0 14px; color: var(--muted); font-size: 12px; }
      input {
        width: 100%;
        height: 36px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel);
        color: var(--ink);
        font-size: 13px;
        outline: none;
        user-select: text;
      }
      input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(71, 114, 250, 0.14); }
      .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
      button {
        height: 32px;
        padding: 0 14px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        font-size: 13px;
        cursor: pointer;
      }
      button.primary { border-color: transparent; background: var(--brand); color: #fff; }
      button:active { transform: translateY(1px); }
      .msg { margin-top: 10px; font-size: 12px; color: var(--muted); min-height: 16px; }
      .msg.err { color: #e5484d; }
      .msg.ok { color: #22a06b; }
    </style>
  </head>
  <body>
    <h1>服务器地址</h1>
    <p class="hint">填写有终服务端地址，例如 http://192.168.1.10:10078 或 https://域名/youzhong</p>
    <input id="url" placeholder="http://192.168.1.10:10078" autocomplete="off" spellcheck="false" />
    <div class="msg" id="msg"></div>
    <div class="row">
      <button id="cancel">取消</button>
      <button id="save" class="primary">保存并重载</button>
    </div>
    <script>
      const input = document.getElementById('url');
      const msg = document.getElementById('msg');
      window.youzhongSettings.load().then((value) => {
        input.value = value || '';
        input.focus();
        input.select();
      });
      document.getElementById('cancel').addEventListener('click', () => window.youzhongSettings.close());
      document.getElementById('save').addEventListener('click', async () => {
        msg.className = 'msg';
        msg.textContent = '正在测试连接…';
        const result = await window.youzhongSettings.save(input.value);
        if (!result || !result.ok) {
          msg.className = 'msg err';
          msg.textContent = result && result.reason ? result.reason : '保存失败';
          return;
        }
        if (result.pingOk === false) {
          msg.className = 'msg err';
          msg.textContent = `已保存，但连接失败：${result.reason || '未知错误'}（仍按此地址加载）`;
          setTimeout(() => window.youzhongSettings.close(), 1600);
          return;
        }
        msg.className = 'msg ok';
        msg.textContent = result.name ? `已连接 ${result.name}，正在重载窗口…` : '已保存，正在重载窗口…';
        setTimeout(() => window.youzhongSettings.close(), 400);
      });
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') document.getElementById('save').click();
        if (event.key === 'Escape') window.youzhongSettings.close();
      });
    </script>
  </body>
</html>
